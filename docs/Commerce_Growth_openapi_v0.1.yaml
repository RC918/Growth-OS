openapi: 3.1.0
info:
  title: Commerce Growth API
  version: 0.1.0
  description: Design contract. No live deployment or authorization is implied.
servers:
  - url: https://staging.example.invalid/api/v1
paths:
  /scans:
    post:
      summary: Queue a public landing page scan
      description: Rate limited; validates public HTTPS destination and redirects. No ownership claim.
      operationId: createScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, business_model]
              properties:
                url: {type: string, format: uri, maxLength: 2048}
                business_model: {type: string, enum: [ecommerce, trade]}
                target_market: {type: string, maxLength: 80}
      responses:
        '202':
          description: Accepted for asynchronous scan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobRef'}
        '400': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /scans/{scanId}:
    get:
      summary: Read public scan status and report
      operationId: getScan
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Scan'}
        '404': {$ref: '#/components/responses/Problem'}
  /organizations:
    post:
      summary: Create a workspace
      security: [{bearerAuth: []}]
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, business_model]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                business_model: {type: string, enum: [ecommerce, trade]}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '401': {$ref: '#/components/responses/Problem'}
  /organizations/{orgId}/sites:
    post:
      summary: Add a site pending domain verification
      security: [{bearerAuth: []}]
      operationId: addSite
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin]
              properties:
                origin: {type: string, format: uri}
      responses:
        '201':
          description: Site and verification challenge
          content:
            application/json:
              schema:
                type: object
                required: [site_id, verification_method, challenge]
                properties:
                  site_id: {type: string, format: uuid}
                  verification_method: {type: string, enum: [dns_txt]}
                  challenge: {type: string}
        '404': {$ref: '#/components/responses/Problem'}
  /organizations/{orgId}/imports:
    post:
      summary: Queue a validated CSV import
      description: CSV is size limited and virus/format checked before queuing. Same Idempotency-Key returns same job.
      security: [{bearerAuth: []}]
      operationId: createImport
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [site_id, source, file, mapping_json]
              properties:
                site_id: {type: string, format: uuid}
                source: {type: string, enum: [ga4, ad_platform, store, crm, gsc]}
                file: {type: string, format: binary}
                mapping_json: {type: string, description: JSON object mapping CSV columns to event fields}
      responses:
        '202':
          description: Import accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobRef'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /organizations/{orgId}/funnel:
    get:
      summary: Read segmented funnel with source and completeness
      security: [{bearerAuth: []}]
      operationId: getFunnel
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: site_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
        - name: source
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Funnel. Null metric means unavailable, not zero.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FunnelReport'}
        '404': {$ref: '#/components/responses/Problem'}
  /organizations/{orgId}/recommendations:
    get:
      summary: List evidence-backed next actions
      security: [{bearerAuth: []}]
      operationId: listRecommendations
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Recommendation'}
  /organizations/{orgId}/recommendations/{recommendationId}/decision:
    post:
      summary: Approve or reject an action proposal
      security: [{bearerAuth: []}]
      operationId: decideRecommendation
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: recommendationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, reject]}
                note: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Decision recorded; does not auto-publish
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recommendation'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ScanId:
      name: scanId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: Application error
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status]
            properties:
              title: {type: string}
              status: {type: integer}
              detail: {type: string}
              code: {type: string}
  schemas:
    JobRef:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, completed, failed]}
    Organization:
      type: object
      required: [id, name, business_model]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        business_model: {type: string, enum: [ecommerce, trade]}
    Finding:
      type: object
      required: [rule_code, severity, evidence_url, confidence, observed_at]
      properties:
        rule_code: {type: string}
        severity: {type: string, enum: [info, low, medium, high]}
        evidence_url: {type: string, format: uri}
        evidence_excerpt: {type: [string, 'null']}
        confidence: {type: string, enum: [low, medium, high]}
        observed_at: {type: string, format: date-time}
        limitations: {type: [string, 'null']}
    Scan:
      type: object
      required: [id, status, requested_url, findings, limitations]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, completed, failed]}
        requested_url: {type: string, format: uri}
        findings: {type: array, items: {$ref: '#/components/schemas/Finding'}}
        limitations: {type: array, items: {type: string}}
    FunnelReport:
      type: object
      required: [site_id, window, segments, data_quality]
      properties:
        site_id: {type: string, format: uuid}
        window:
          type: object
          required: [from, to]
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
        segments:
          type: array
          items:
            type: object
            required: [source, landing_sessions, leads, purchases]
            properties:
              source: {type: string}
              landing_sessions: {type: [integer, 'null'], minimum: 0}
              leads: {type: [integer, 'null'], minimum: 0}
              purchases: {type: [integer, 'null'], minimum: 0}
        data_quality:
          type: object
          required: [sources, last_synced_at, limitations]
          properties:
            sources: {type: array, items: {type: string}}
            last_synced_at: {type: [string, 'null'], format: date-time}
            limitations: {type: array, items: {type: string}}
    Recommendation:
      type: object
      required: [id, title, rationale, evidence_type, status]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        rationale: {type: string}
        evidence_type: {type: string, enum: [observed, associated, estimated]}
        status: {type: string, enum: [proposed, approved, rejected, executed]}
