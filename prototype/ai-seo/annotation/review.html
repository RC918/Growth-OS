<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth-OS 文案證據審閱</title>
<style>
  :root { color-scheme: light; }
  body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; background: #f4f6f8; color: #1c2733; }
  header { background: #17324f; color: #fff; padding: 20px 24px; }
  header h1 { margin: 0 0 6px; font-size: 22px; }
  header p { margin: 0; opacity: .85; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 64px; }
  .bar { background: #fff; border: 1px solid #d8e0e8; padding: 14px 16px; margin-bottom: 16px; }
  .bar input { font-size: 16px; padding: 6px 8px; }
  .card { background: #fff; border: 1px solid #d8e0e8; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 10px; color: #52616e; }
  .evidence { background: #eef4ea; border: 1px solid #cfdec6; padding: 10px 12px; white-space: pre-wrap; }
  .claim { font-size: 18px; line-height: 1.6; margin: 14px 0; }
  .choices label { display: inline-block; margin: 4px 10px 4px 0; font-size: 16px; }
  textarea { width: 100%; min-height: 52px; font-size: 15px; }
  button { font-size: 16px; padding: 10px 16px; margin: 6px 8px 6px 0; cursor: pointer; }
  .primary { background: #17324f; color: #fff; border: 0; }
  #progress { font-weight: 600; }
  details { background: #fff; border: 1px solid #d8e0e8; padding: 14px 16px; }
  table { border-collapse: collapse; width: 100%; } td, th { border: 1px solid #d8e0e8; padding: 6px; text-align: left; }
</style>
</head>
<body>
<header>
  <h1>文案證據審閱</h1>
  <p>請逐題閱讀「來源證據」與「待判斷文案」，判斷文案是否符合證據。不需要任何技術背景。每題附中文翻譯僅協助理解，判定請以證據內容為準。</p>
</header>
<main>
  <div class="bar">
    <label>審閱者代號：<input id="annotator" placeholder="例如 A 或 B"></label>
    <div>
      <button id="exportBackup">備份進度檔</button>
      <label>還原進度檔：<input type="file" id="importBackup" accept=".json"></label>
    </div>
    <p>若瀏覽器或開啟方式不保存進度，請用「備份進度檔」把進度存成檔案，下次用「還原進度檔」載入即可繼續，內容與代號都會一起還原。</p>
    <span id="progress"></span>
    <div>
      <button class="primary" id="exportCsv">下載我的審閱結果 (CSV)</button>
      <button id="exportJson">下載 JSON</button>
    </div>
    <p>每位審閱者請各自填寫並下載自己的檔案，不要互相討論答案。進度會自動保存在這台裝置的瀏覽器中。</p>
  </div>
  <div id="cases"></div>
  <details>
    <summary>裁決者專用：比對兩位審閱者</summary>
    <p>依序選取兩位審閱者的 CSV 檔案，系統只列出判定不同的題目。裁決者選定最終判定後，可下載裁決紀錄。</p>
    <input type="file" id="fileA" accept=".csv">
    <input type="file" id="fileB" accept=".csv">
    <div id="disputes"></div>
    <button class="primary" id="exportAdj" disabled>下載裁決紀錄 (CSV)</button>
  </details>
</main>
<script>
const CASES = [{"id":"h01","language":"en","text":"Built for fast freeriding and downhill runs, The Clark keeps a long, stable platform.","text_zh":"The Clark 為快速自由騎乘與下坡路段而打造，保有長而穩定的板身平台。","evidence":[{"excerpt":"from fast freeriding and downhill runs","excerpt_zh":"源自快速自由騎乘與下坡路段"}]},{"id":"h11","language":"en","text":"The Clark is a carbon fiber shortboard weighing 2 kg.","text_zh":"The Clark 是一張碳纖維短板，重 2 公斤。","evidence":[{"excerpt":"long skateboard","excerpt_zh":"長滑板"}]},{"id":"h21","language":"en","text":"The Clark is not a shortboard; it is a 40.2 inch long skateboard.","text_zh":"The Clark 不是短板；它是一張 40.2 吋長的長滑板。","evidence":[{"excerpt":"40.2 inch long skateboard","excerpt_zh":"40.2 吋長的滑板"}]},{"id":"h02","language":"en","text":"The Clark bridges the gap between a traditional skateboard and a longboard.","text_zh":"The Clark 介於傳統滑板與長板之間，彌補兩者的差距。","evidence":[{"excerpt":"bridges the gap between a traditional skateboard and a longboard","excerpt_zh":"彌補傳統滑板與長板之間的差距"}]},{"id":"h12","language":"en","text":"The Clark comes with a lifetime warranty and free replacements.","text_zh":"The Clark 附終身保固與免費換新。","evidence":[{"excerpt":"built to skate everything","excerpt_zh":"為滑行一切而打造"}]},{"id":"h22","language":"en","text":"The Clark is not a twin kick longboard.","text_zh":"The Clark 不是雙向板尾長板。","evidence":[{"excerpt":"twin kick longboard","excerpt_zh":"雙向板尾長板"}]},{"id":"h03","language":"zh-TW","text":"The Clark 適合快速下坡與滑板公園。","text_zh":"The Clark 適合快速下坡與滑板公園。（原文為中文，此為原文）","evidence":[{"excerpt":"skating park","excerpt_zh":"滑板公園"}]},{"id":"h13","language":"en","text":"BIC00001 is a carbon road bike with 22 gears.","text_zh":"BIC00001 是一台碳纖維公路車，有 22 段變速。","evidence":[{"excerpt":"Downhill Bike – Sunday Team","excerpt_zh":"下坡自行車 – Sunday Team"}]},{"id":"h23","language":"en","text":"The Clark measures 102.1 centimeters from nose to tail.","text_zh":"The Clark 從板頭到板尾長 102.1 公分。","evidence":[{"excerpt":"40.2 inch","excerpt_zh":"40.2 吋"}]},{"id":"h04","language":"en","text":"Designed to handle tricks, skateparks, and street skating, The Clark is a twin kick longboard.","text_zh":"The Clark 設計用於應付特技、滑板公園與街頭滑行，是一張雙向板尾長板。","evidence":[{"excerpt":"to tricks, skateparks, and street skating","excerpt_zh":"至特技、滑板公園與街頭滑行"}]},{"id":"h14","language":"en","text":"The Clark reaches 45 mph and climbs any hill without pushing.","text_zh":"The Clark 時速可達 45 英里，不用推板就能爬上任何山坡。","evidence":[{"excerpt":"bombing hills","excerpt_zh":"衝下山坡"}]},{"id":"h24","language":"en","text":"The Clark measures 102.1 inches from nose to tail.","text_zh":"The Clark 從板頭到板尾長 102.1 吋。","evidence":[{"excerpt":"40.2 inch","excerpt_zh":"40.2 吋"}]},{"id":"h05","language":"en","text":"From the woocommerce Demo line: BIC00001, the Downhill Bike – Sunday Team.","text_zh":"來自 woocommerce 示範產品線：BIC00001，下坡自行車 – Sunday Team。","evidence":[{"excerpt":"Downhill Bike – Sunday Team","excerpt_zh":"下坡自行車 – Sunday Team"}]},{"id":"h15","language":"en","text":"The Clark is made of maple and bamboo with a 32 inch wheelbase.","text_zh":"The Clark 由楓木與竹子製成，軸距 32 吋。","evidence":[{"excerpt":"40.2″ long skateboard","excerpt_zh":"40.2 吋長的滑板"}]},{"id":"h25","language":"en","text":"The Clark, the versatile pro model by Clark Patrick, available now.","text_zh":"The Clark，Clark Patrick 的多功能職業型號，現在有售。","evidence":[{"excerpt":"UNKNOWN","excerpt_zh":"未知（UNKNOWN）"}]},{"id":"h06","language":"en","text":"At 40.2 inches long, The Clark is built to skate everything.","text_zh":"The Clark 長 40.2 吋，為滑行一切地形而打造。","evidence":[{"excerpt":"40.2 inch long skateboard is built to keep up","excerpt_zh":"40.2 吋長的滑板，為跟上（一切）而打造"}]},{"id":"h16","language":"zh-TW","text":"The Clark 是鈦合金短板，長度只有 80 公分。","text_zh":"The Clark 是鈦合金短板，長度只有 80 公分。（原文為中文，此為原文）","evidence":[{"excerpt":"40.2 inch long skateboard","excerpt_zh":"40.2 吋長的滑板"}]},{"id":"h26","language":"en","text":"Conflicting Board, presented without its disputed description.","text_zh":"Conflicting Board，呈現時不附其有爭議的描述。","evidence":[{"excerpt":"Conflicting Board","excerpt_zh":"Conflicting Board"}]},{"id":"h07","language":"en","text":"Versatility was the priority when this pro model was designed.","text_zh":"這款職業型號在設計時，以多功能性為優先。","evidence":[{"excerpt":"versatility was the priority","excerpt_zh":"多功能性是優先考量"}]},{"id":"h17","language":"en","text":"The Clark is the cheapest pro model and is on sale now.","text_zh":"The Clark 是最便宜的職業型號，現在特價中。","evidence":[{"excerpt":"his pro model","excerpt_zh":"他的職業型號"}]},{"id":"h27","language":"zh-TW","text":"Conflicting Board 是楓木完整的板。","text_zh":"Conflicting Board 是楓木完整的板。（原文為中文，此為原文）","evidence":[{"excerpt":"Maple complete.","excerpt_zh":"楓木完整版。"}]},{"id":"h08","language":"zh-TW","text":"這張長板有雙向板尾，適合街頭滑行。","text_zh":"這張長板有雙向板尾，適合街頭滑行。（原文為中文，此為原文）","evidence":[{"excerpt":"double kick shape","excerpt_zh":"雙向板尾（double kick）形狀"}]},{"id":"h18","language":"en","text":"Conflicting Board. Carbon complete with lifetime warranty.","text_zh":"Conflicting Board。碳纖維完整版，附終身保固。","evidence":[{"excerpt":"Conflicting Board. Maple complete.","excerpt_zh":"Conflicting Board。楓木完整版。"}]},{"id":"h28","language":"en","text":"The Clark is slower and less stable than a traditional skateboard.","text_zh":"The Clark 比傳統滑板更慢、更不穩定。","evidence":[{"excerpt":"long, stable platform","excerpt_zh":"長而穩定的平台"}]},{"id":"h09","language":"en","text":"Bombing hills and slashing curbs are both in The Clark's brief.","text_zh":"衝下山坡和削過路緣，都在 The Clark 的任務範圍內。","evidence":[{"excerpt":"bombing hills, slashing curbs","excerpt_zh":"衝下山坡、削過路緣"}]},{"id":"h19","language":"en","text":"BIC00001 – Sunday Team helmet with MIPS protection.","text_zh":"BIC00001 – Sunday Team 安全帽，具 MIPS 防護。","evidence":[{"excerpt":"Downhill Bike – Sunday Team","excerpt_zh":"下坡自行車 – Sunday Team"}]},{"id":"h29","language":"zh-TW","text":"The Clark 不是一張短板，而是一張 40.2 吋長的長板。","text_zh":"The Clark 不是一張短板，而是一張 40.2 吋長的長板。（原文為中文，此為原文）","evidence":[{"excerpt":"40.2 inch long skateboard","excerpt_zh":"40.2 吋長的滑板"}]},{"id":"h10","language":"en","text":"What is The Clark? A twin kick longboard designed to handle it all.","text_zh":"The Clark 是什麼？一張設計來應付一切的雙向板尾長板。","evidence":[{"excerpt":"twin kick longboard designed to handle it all","excerpt_zh":"設計來應付一切的雙向板尾長板"}]},{"id":"h20","language":"en","text":"The Clark is designed exclusively for indoor racing on ice.","text_zh":"The Clark 專為室內冰上競速而設計。","evidence":[{"excerpt":"street skating","excerpt_zh":"街頭滑行"}]},{"id":"h30","language":"en","text":"The Clark is a twin kick longboard with carbon trucks.","text_zh":"The Clark 是一張配有碳纖維輪架的雙向板尾長板。","evidence":[{"excerpt":"twin kick longboard","excerpt_zh":"雙向板尾長板"}]}];
const root = document.getElementById('cases');
const annotatorInput = document.getElementById('annotator');
// The annotator code itself is persisted first: without it, a
// reload would look up the anonymous bucket and the saved answers
// would appear lost even though they are still stored.
const CODE_KEY = 'growthos-review-annotator-code';
try { annotatorInput.value = localStorage.getItem(CODE_KEY) || ''; } catch {}
const storeKey = () => 'growthos-review-' + (annotatorInput.value.trim() || 'anon');
const load = () => { try { return JSON.parse(localStorage.getItem(storeKey()) || '{}'); } catch { return {}; } };
const save = (state) => {
  try {
    localStorage.setItem(CODE_KEY, annotatorInput.value.trim());
    localStorage.setItem(storeKey(), JSON.stringify(state));
  } catch {}
};
function render() {
  const state = load();
  root.innerHTML = '';
  CASES.forEach((c, i) => {
    const card = document.createElement('section'); card.className = 'card';
    const saved = state[c.id] || {};
    card.innerHTML = '<h2>第 ' + (i + 1) + ' 題（共 ' + CASES.length + ' 題）</h2>'
      + '<div>來源證據（英文原文）：</div><div class="evidence"></div>'
      + '<div>來源證據（中文翻譯，僅協助理解）：</div><div class="evidence zh"></div>'
      + '<div class="claim"></div><div class="claim zh"></div>'
      + '<div class="choices">'
      + ['正確', '錯誤', '無法判定'].map(v =>
          '<label><input type="radio" name="' + c.id + '" value="' + v + '"'
          + (saved.decision === v ? ' checked' : '') + '> ' + v + '</label>').join('')
      + '</div>'
      + '<label>理由（必填，一句話即可）<textarea data-reason="' + c.id + '"></textarea></label>';
    card.querySelector('.evidence').textContent = c.evidence.map(e => e.excerpt).join('\n---\n');
    card.querySelector('.evidence.zh').textContent = c.evidence.map(e => e.excerpt_zh).join('\n---\n');
    card.querySelector('.claim').textContent = '待判斷文案（英文原文）：' + c.text;
    card.querySelector('.claim.zh').textContent = '待判斷文案（中文翻譯，僅協助理解）：' + c.text_zh;
    const area = card.querySelector('textarea'); area.value = saved.reason || '';
    card.querySelectorAll('input[type=radio]').forEach(r => r.addEventListener('change', () => {
      const s = load(); s[c.id] = {decision: r.value, reason: area.value}; save(s); progress();
    }));
    area.addEventListener('input', () => {
      const s = load(); s[c.id] = {decision: (s[c.id] || {}).decision || '', reason: area.value}; save(s); progress();
    });
    root.appendChild(card);
  });
  progress();
}
function rows() {
  const state = load();
  return CASES.map(c => ({case_id: c.id, annotator_code: annotatorInput.value.trim(),
    decision: (state[c.id] || {}).decision || '', reason: (state[c.id] || {}).reason || ''}));
}
function progress() {
  const done = rows().filter(r => r.decision && r.reason.trim()).length;
  document.getElementById('progress').textContent = ' 已完成 ' + done + ' / ' + CASES.length + ' 題';
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
const csvCell = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
document.getElementById('exportCsv').addEventListener('click', () => {
  const lines = ['case_id,annotator_code,decision,reason'];
  rows().forEach(r => lines.push([r.case_id, r.annotator_code, r.decision, r.reason].map(csvCell).join(',')));
  download('review-' + (annotatorInput.value.trim() || 'anon') + '.csv', lines.join('\n'), 'text/csv');
});
document.getElementById('exportJson').addEventListener('click', () => {
  download('review-' + (annotatorInput.value.trim() || 'anon') + '.json',
    JSON.stringify(rows(), null, 2), 'application/json');
});
annotatorInput.addEventListener('input', () => {
  try { localStorage.setItem(CODE_KEY, annotatorInput.value.trim()); } catch {}
});
annotatorInput.addEventListener('change', render);
document.getElementById('exportBackup').addEventListener('click', () => {
  download('review-progress-' + (annotatorInput.value.trim() || 'anon') + '.json',
    JSON.stringify({annotator_code: annotatorInput.value.trim(), answers: load()}, null, 2),
    'application/json');
});
document.getElementById('importBackup').addEventListener('change', async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || typeof data.answers !== 'object') throw new Error('bad backup');
    annotatorInput.value = data.annotator_code || '';
    save(data.answers);
    render();
  } catch { alert('進度檔無法讀取，請確認檔案是否正確。'); }
});
let adjRows = [];
function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/).slice(1);
  return Object.fromEntries(lines.map(line => {
    const cells = line.match(/("([^"]|"")*"|[^,]*)/g).filter((v, i) => i % 2 === 0 || v !== '');
    const clean = (v) => (v || '').replace(/^"|"$/g, '').replace(/""/g, '"');
    return [clean(cells[0]), {decision: clean(cells[2]), reason: clean(cells[3])}];
  }));
}
async function compare() {
  const fa = document.getElementById('fileA').files[0];
  const fb = document.getElementById('fileB').files[0];
  if (!fa || !fb) return;
  const a = parseCsv(await fa.text()); const b = parseCsv(await fb.text());
  adjRows = [];
  const box = document.getElementById('disputes'); box.innerHTML = '';
  const table = document.createElement('table');
  table.innerHTML = '<tr><th>題號</th><th>審閱者一</th><th>審閱者二</th><th>裁決</th></tr>';
  CASES.forEach(c => {
    if ((a[c.id] || {}).decision === (b[c.id] || {}).decision) return;
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + c.id + '</td><td></td><td></td><td>'
      + ['正確', '錯誤', '無法判定'].map(v => '<label><input type="radio" name="adj-' + c.id + '" value="' + v + '"> ' + v + '</label>').join(' ')
      + '</td>';
    tr.children[1].textContent = ((a[c.id] || {}).decision || '') + '：' + ((a[c.id] || {}).reason || '');
    tr.children[2].textContent = ((b[c.id] || {}).decision || '') + '：' + ((b[c.id] || {}).reason || '');
    tr.querySelectorAll('input').forEach(r => r.addEventListener('change', () => {
      adjRows = adjRows.filter(x => x.case_id !== c.id);
      adjRows.push({case_id: c.id, annotator_a: (a[c.id] || {}).decision || '',
        annotator_b: (b[c.id] || {}).decision || '', adjudicated: r.value});
      document.getElementById('exportAdj').disabled = false;
    }));
    table.appendChild(tr);
  });
  if (!table.querySelectorAll('tr').length || table.rows.length === 1) {
    box.textContent = '兩位審閱者沒有分歧。';
  } else box.appendChild(table);
}
document.getElementById('fileA').addEventListener('change', compare);
document.getElementById('fileB').addEventListener('change', compare);
document.getElementById('exportAdj').addEventListener('click', () => {
  const lines = ['case_id,annotator_a,annotator_b,adjudicated'];
  adjRows.forEach(r => lines.push([r.case_id, r.annotator_a, r.annotator_b, r.adjudicated].map(csvCell).join(',')));
  download('adjudication.csv', lines.join('\n'), 'text/csv');
});
render();
</script>
</body>
</html>
