<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://vhzryhibmpvglzcmfnaa.supabase.co; form-action 'none'; base-uri 'none'">
  <title>Growth OS｜Auth 隔離驗收</title>
  <link rel="stylesheet" href="/auth-acceptance.css">
  <script defer src="/auth-acceptance.js"></script>
</head>
<body>
  <main>
    <h1>Growth OS 測試帳號隔離驗收</h1>
    <p>僅限合成測試資料。密碼直接送往獨立 Growth OS Supabase Auth；本頁不儲存密碼或登入權杖。測完會移除此臨時頁面。</p>
    <form id="account-a" autocomplete="off">
      <h2>帳號 A</h2>
      <label>電子郵件 <input type="email" name="email" autocomplete="username" required></label>
      <label>密碼 <input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">驗證帳號 A</button>
      <output role="status" aria-live="polite"></output>
    </form>
    <form id="account-b" autocomplete="off">
      <h2>帳號 B</h2>
      <label>電子郵件 <input type="email" name="email" autocomplete="username" required></label>
      <label>密碼 <input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">驗證帳號 B</button>
      <output role="status" aria-live="polite"></output>
    </form>
    <p id="overall" role="status" aria-live="polite">等待兩個帳號分別驗證。</p>
  </main>
</body>
</html>
