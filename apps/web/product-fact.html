<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'"><title>Growth OS｜產品事實與成果</title><link rel="stylesheet" href="./first-result.css"><link rel="stylesheet" href="./product-fact.css"><script type="module" src="./product-fact.mjs"></script></head><body><header><a href="#">Growth OS</a><span>隔離工程驗證</span></header><main><h1>回答一次，更新相關成果</h1><p class="badge">Synthetic 合成產品與規則候選 · 非真 AI 理解 · 未發布 · 未量測</p><section><h2>隔離工作區</h2><p>僅本機 runner 可登入測試身分，沒有正式商家帳號或遠端保存。</p><label for="actor">測試角色</label><select id="actor"><option value="owner">商家 Owner</option><option value="viewer">唯讀 Viewer</option><option value="foreign">另一工作區 Owner</option></select><div class="actions"><button id="login">登入隔離工作區</button><button id="logout" hidden>登出</button></div><p id="auth-status" role="status">尚未登入；一般靜態部署不會開放此隔離服務。</p></section><section id="result" hidden><label for="product">產品與市場</label><select id="product"></select><h2 id="product-name"></h2><p id="scope"></p><p id="draft" class="copy-text"></p><p id="state"></p><details><summary>來源、答案與版本</summary><pre id="evidence" class="copy-text"></pre><div id="history"></div></details><form id="answer-form"><h3>這項產品支援戶外使用嗎？</h3><p id="answer-help">來源未交代戶外適用性；答案只影響這項產品、此市場的介紹。可以稍後回答，草稿將避開這項宣稱。</p><label for="answer">你的確認</label><select id="answer" aria-describedby="answer-help feedback"><option value="">請選擇</option><option value="yes">支援</option><option value="no">不支援</option></select><div class="actions"><button id="save" type="submit">保存答案並更新草稿</button><button id="skip" type="button">稍後回答，保存安全候選</button></div></form><button id="correct" hidden>修正已保存答案</button><p id="feedback" role="status"></p><button id="reconcile" hidden>只核對原操作結果</button><button id="refresh">讀取最新版本</button><div id="review-panel"><label class="review-check"><input type="checkbox" id="review-check">我已核對目前這個確切版本</label><button id="review">確認此版內容（不是發布）</button></div></section></main></body></html>
