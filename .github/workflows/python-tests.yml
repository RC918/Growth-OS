name: Python prototype tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public audit tests
        working-directory: prototype/public-audit
        run: python3 -m unittest -v test_scanner.py test_app.py
      - name: Offline proof example
        working-directory: prototype/offline-proof
        run: python3 proof.py --actions data/actions.csv --metrics data/metrics.csv --events data/events.csv --output /tmp/growth-os-proof.json
      - name: CSV import preview tests
        working-directory: prototype/csv-import
        run: python3 -m unittest -v test_validate.py test_store.py test_gsc_daily.py
      - name: Migration static contract checks
        working-directory: supabase
        run: python3 -m unittest -v test_migration_contract.py
      - name: Live Auth mutation runner offline checks
        run: python3 -m unittest discover -s supabase/tests -p test_real_auth_mutation_check.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Workspace API contract checks
        run: node --test prototype/owner-workspace/workspace-api.test.mjs
      - name: Browser baseline data contract checks
        run: node --test prototype/csv-import/search-baseline.test.mjs
      - name: Install isolated UI test browser
        run: npm ci --ignore-scripts
      - name: Guided goal contract and DOM checks
        run: node --test prototype/owner-workspace/goal-intake.test.mjs prototype/owner-workspace/goal-panel.test.mjs
      - name: Offline inference proposal contract checks (test doubles only)
        run: node --test prototype/owner-workspace/goal-inference-contract.test.mjs
      - name: Offline draft confirmation state and source checks (memory only)
        run: node --test prototype/owner-workspace/offline-draft-session.test.mjs
      - name: Guided goal PostgreSQL engine checks
        run: node supabase/tests/goal_intake_postgres.mjs
      - name: Offline model trial handler and ledger checks (no provider calls)
        run: |
          node --check supabase/functions/growth-model-trial/index.js
          node --test supabase/tests/model_trial/handler.test.mjs
          node --test supabase/tests/model_trial/live_single_case.test.mjs
          node supabase/tests/model_trial/ledger_engine.mjs
          node supabase/tests/model_trial/integration.mjs
          node supabase/tests/model_trial/deadline_engine.mjs
      - name: Model trial atomic reservation on independent PG17 backends (no network)
        run: python3 -B supabase/tests/model_trial/native_ledger.py
      - name: Supabase Edge Runtime closed-gate user worker (no network or keys)
        run: python3 -B supabase/tests/model_trial/edge_runtime.py
      - name: Offline probe boundary checks (PGlite only)
        run: node supabase/tests/goal_lock_probe/test.mjs
      - name: Offline probe controller and DCL operator checks
        run: |
          python3 -B -m unittest discover -s supabase/tests/goal_lock_probe -p test_remote_overlap.py -v
          node supabase/tests/goal_lock_probe/test_acl_operator.mjs
      - name: Install Chromium for UI acceptance
        run: npx playwright install --with-deps chromium
      - name: Baseline desktop and mobile UI acceptance
        run: node prototype/csv-import/baseline-ui.e2e.mjs
      - name: Workspace observation desktop and mobile UI acceptance
        run: node prototype/owner-workspace/observations-ui.e2e.mjs
      - name: Guided goal desktop and mobile UI acceptance
        run: node prototype/owner-workspace/goal-intake-ui.e2e.mjs
      - name: Offline draft confirmation desktop and mobile acceptance (no remote requests)
        run: node prototype/owner-workspace/offline-draft-ui.e2e.mjs
