name: Handoff bridge tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Handoff bridge and review flag tests
        run: node --test delivery/web-preview/handoff-bridge.test.mjs delivery/web-preview/review-flag.test.mjs
      - name: Auto-handoff config guard tests
        run: node --test supabase/tests/auto_handoff_config.test.mjs
      - name: Install isolated UI test browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Isolated browser handoff bridge acceptance (synthetic transport)
        timeout-minutes: 6
        run: node supabase/tests/auto_handoff_isolated.mjs
